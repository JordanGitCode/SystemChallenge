<h2>Products</h2>
@if (error()) { <p class="text-danger">{{ error() }}</p> }
<table class="table">
<thead><tr><th>Name</th><th>SKU</th><th>Price</th><th>Status</th></tr></thead>
<tbody>
    @for (p of products(); track p.id) {
    <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.sku }}</td>
        <td>{{ p.price | currency }}</td>
        <td><span class="badge" [class]="'badge badge--' + statusLabel(p.status).toLowerCase()">{{ statusLabel(p.status) }}</span></td>
    </tr>
    }
</tbody>
</table>
